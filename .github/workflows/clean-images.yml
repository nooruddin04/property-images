
name: Clean property images

on:
  workflow_dispatch:
  push:
    paths:
      - 'images/**'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clean images
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            git diff-tree --no-commit-id --name-only -r \
              "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA" \
              -- images/ > /tmp/changed.txt

            mapfile -t files < /tmp/changed.txt

            if [ "${#files[@]}" -gt 0 ]; then
              python scripts/clean_images.py "${files[@]}"
            else
              echo "No changed images to process"
            fi
          else
            python scripts/clean_images.py
          fi

      - name: Commit cleaned images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/
          if git diff --cached --quiet; then
            echo "No image changes to commit"
          else
            git commit -m "Clean property images [skip ci]"
            git push
          fi
